<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🐱</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 360px;
    }

    .text {
      margin-top: 16px;
      font-size: 20px;
      color: #333;
    }

    svg {
      width: 100%;
      max-width: 260px;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Cute Cat SVG -->
    <svg viewBox="0 0 200 200" aria-label="Cute cat">
      <!-- ears -->
      <polygon points="40,40 70,10 90,50" fill="#ffccbc"/>
      <polygon points="160,40 130,10 110,50" fill="#ffccbc"/>

      <!-- head -->
      <circle cx="100" cy="100" r="70" fill="#ffe0b2"/>

      <!-- eyes -->
      <circle cx="75" cy="95" r="8" fill="#333"/>
      <circle cx="125" cy="95" r="8" fill="#333"/>

      <!-- blush -->
      <circle cx="60" cy="115" r="6" fill="#ffab91"/>
      <circle cx="140" cy="115" r="6" fill="#ffab91"/>

      <!-- nose -->
      <polygon points="100,110 95,118 105,118" fill="#ff8a65"/>

      <!-- mouth -->
      <path d="M95 120 Q100 125 105 120" stroke="#333" stroke-width="2" fill="none"/>
    </svg>

    <!-- Text -->
    <div class="text">
      Gaeh kog nescafe stick ☕
    </div>

  </div>

</body>
</html>
